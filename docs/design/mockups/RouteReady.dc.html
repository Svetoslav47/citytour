  </section>
</div>

    const ST = [[705.6,171.9],[700.0,232.0],[577.8,507.0],[461.1,498.4],[522.2,524.2],[377.8,524.2],[494.4,567.2],[555.6,876.5],[533.3,919.5],[488.9,1048.4],[361.1,1117.1]];
    const IDX = [0, 13, 48, 65, 71, 76, 94, 150, 161, 178, 220];
    const pts = (a) => a.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    const plaque = (label, sx, sy, kind) => {
      let size = 28;
