<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1D6B5B}a:hover{color:#155446}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: linear-gradient(180deg, #E6EAE8 0%, #D4DBD8 100%); font-family: 'HarmonyOS Sans', 'HarmonyOS Sans SC', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Noto Sans SC', sans-serif; color: #16181A; display: flex; flex-direction: column; align-items: center">
  <div style="flex: none; height: 64px"></div>
  <span role="img" aria-label="Locked" style="display: flex"><span style="display: flex; color: #16181A"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><rect x="5" y="10.5" width="14" height="10" rx="2.75" fill="currentColor" stroke="none"></rect><path d="M8.25 10.5V8a3.75 3.75 0 0 1 7.5 0v2.5"></path></svg></span></span>
  <div style="margin-top: 20px; font-size: 92px; line-height: 96px; font-weight: 600; letter-spacing: -2px; font-variant-numeric: tabular-nums">14:32</div>
  <div style="margin-top: 4px; font-size: 17px; line-height: 22px; font-weight: 500; color: #3A4044">Saturday, 3 October</div>

  <!-- System media card (AVSession, 'audio' template; favourite/loop/seek turned off) -->
  <section aria-label="Now playing in CityTour" style="margin-top: 40px; width: 358px; box-sizing: border-box; padding: 16px 16px 10px; border-radius: 24px; background: rgba(255, 255, 255, 0.66); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div role="img" aria-label="Artwork: stop 4 plaque" style="flex: none; width: 64px; height: 64px; border-radius: 14px; background: #1D6B5B; display: flex; align-items: center; justify-content: center">
        <span style="width: 38px; height: 38px; border-radius: 50%; box-shadow: inset 0 0 0 2.5px rgba(255, 255, 255, 0.92); display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 19px; line-height: 24px; font-weight: 700; font-variant-numeric: tabular-nums">4</span>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #5A6066">CityTour</span>
        <span style="font-size: 17px; line-height: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Walking to Cloth Hall</span>
        <span style="font-size: 14px; line-height: 20px; color: #5A6066; font-variant-numeric: tabular-nums">Next: Cloth Hall &#183; 120 m</span>
      </div>
      <button aria-label="Audio output: headphones" style="flex: none; align-self: flex-start; width: 48px; height: 48px; margin: -12px -12px 0 0; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="display: flex; color: #5A6066"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M4.25 15.5v-3.25a7.75 7.75 0 0 1 15.5 0v3.25"></path><rect x="3.5" y="14" width="4.25" height="6.75" rx="1.75"></rect><rect x="16.25" y="14" width="4.25" height="6.75" rx="1.75"></rect></svg></span></button>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 18px; color: #2B3034; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Walk down Floria&#324;ska Street, towards the brick church.</p>
    <div style="display: flex; align-items: center; justify-content: center; gap: 44px">
      <button aria-label="Replay" style="width: 48px; height: 48px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="display: flex; color: #16181A"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none; display: block"><path d="M19.25 6.3v11.4a1.1 1.1 0 0 1-1.73.9l-8.1-5.7a1.1 1.1 0 0 1 0-1.8l8.1-5.7a1.1 1.1 0 0 1 1.73.9z"></path><rect x="4.5" y="5.25" width="2.75" height="13.5" rx="1.375"></rect></svg></span></button>
      <button aria-label="Pause" style="width: 56px; height: 56px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="display: flex; color: #16181A"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none; display: block"><rect x="6" y="4.75" width="4.25" height="14.5" rx="1.4"></rect><rect x="13.75" y="4.75" width="4.25" height="14.5" rx="1.4"></rect></svg></span></button>
      <button aria-label="Skip" style="width: 48px; height: 48px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="display: flex; color: #16181A"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none; display: block"><path d="M4.75 6.3v11.4a1.1 1.1 0 0 0 1.73.9l8.1-5.7a1.1 1.1 0 0 0 0-1.8l-8.1-5.7a1.1 1.1 0 0 0-1.73.9z"></path><rect x="16.75" y="5.25" width="2.75" height="13.5" rx="1.375"></rect></svg></span></button>
    </div>
  </section>

  <!-- System continuous-task notification -->
  <section aria-label="Notification from CityTour" style="margin-top: 10px; width: 358px; box-sizing: border-box; padding: 14px 16px; border-radius: 20px; background: rgba(255, 255, 255, 0.66); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); display: flex; align-items: flex-start; gap: 12px">
    <span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border-radius: 8px; background: #1D6B5B; display: flex; align-items: center; justify-content: center">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display: block"><path d="M7.5 17.5c1-3.5 4.5-3.25 6-5.5s.75-3.5.75-3.5" stroke="#F4F5F3" stroke-width="2" stroke-linecap="round"></path><circle cx="14.6" cy="7.2" r="1.9" fill="#F4F5F3"></circle></svg>
          </span>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
        <span style="font-size: 13px; line-height: 18px; font-weight: 500; color: #5A6066">CityTour</span>
        <span style="font-size: 12px; line-height: 16px; color: #5A6066">now</span>
      </div>
      <span style="font-size: 15px; line-height: 20px">CityTour is using your location</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { };
  }
}
</script>
</body>
</html>
