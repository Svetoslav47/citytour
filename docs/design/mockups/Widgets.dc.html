<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home-screen widgets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1D6B5B}a:hover{color:#155446}
</style>
</helmet>
<div style="width: 900px; height: 700px; position: relative; overflow: hidden; background: linear-gradient(180deg, #E4E8E6 0%, #CFD6D3 100%); font-family: 'HarmonyOS Sans', 'HarmonyOS Sans SC', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Noto Sans SC', sans-serif; color: #16181A; display: flex; align-items: center; justify-content: center; gap: 32px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
      <article aria-label="CityTour widget, 2 by 2, tour in progress" style="width: 184px; height: 184px; padding: 14px 16px 16px; box-sizing: border-box; border-radius: 20px; background: #FFFFFF; display: flex; flex-direction: column">
        <div style="display: flex; align-items: flex-start; justify-content: space-between">
          <p style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.6px; color: #5A6066; padding-top: 6px; font-variant-numeric: tabular-nums">NEXT &#183; 4/11</p>
          <div style="margin: -4px -10px 0 0"><button aria-label="Pause" style="flex: none; width: 48px; height: 48px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <span style="width: 40px; height: 40px; border-radius: 50%; background: #EEEFEC; display: flex; align-items: center; justify-content: center"><span style="display: flex; color: #16181A"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none; display: block"><rect x="6" y="4.75" width="4.25" height="14.5" rx="1.4"></rect><rect x="13.75" y="4.75" width="4.25" height="14.5" rx="1.4"></rect></svg></span></span>
            </button></div>
        </div>
        <div style="margin-top: auto; display: flex; flex-direction: column">
          <span style="font-size: 18px; line-height: 24px; font-weight: 500">Cloth Hall</span>
          <span style="margin-top: 2px; font-size: 28px; line-height: 32px; font-weight: 700; font-variant-numeric: tabular-nums">120 m</span>
          <span style="margin-top: 2px; font-size: 12px; line-height: 16px; font-weight: 500; color: #5A6066">ahead, right</span>
        </div>
      </article>
      <p style="margin: 0; font-size: 13px; line-height: 18px; color: #2B3034; text-align: center"><span style="font-weight: 600">2&#215;2</span> &#183; Active tour</p>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
      <article aria-label="CityTour widget, 2 by 4, tour in progress" style="width: 384px; height: 184px; padding: 14px 16px 8px; box-sizing: border-box; border-radius: 20px; background: #FFFFFF; display: flex; flex-direction: column">
        <p style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.6px; color: #5A6066">NEXT &#183; STOP 4 OF 11</p>
        <div style="margin-top: 4px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
          <span style="font-size: 18px; line-height: 24px; font-weight: 500">Cloth Hall</span>
          <span style="font-size: 24px; line-height: 28px; font-weight: 700; font-variant-numeric: tabular-nums">120 m</span>
        </div>
        <div style="margin-top: 2px; display: flex; justify-content: space-between; gap: 12px; font-size: 12px; line-height: 16px; font-weight: 500; color: #5A6066">
          <span>ahead, slightly right</span><span style="font-variant-numeric: tabular-nums">~2 min</span>
        </div>
        <div role="img" aria-label="Progress: 3 of 11 stops visited, stop 4 next" style="margin-top: 12px; height: 24px; display: flex; align-items: center; gap: 3px">
          <span style="flex: none; width: 14px; height: 14px; border-radius: 50%; background: rgba(107, 113, 118, 0.85); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block"><path d="M6.5 12.5l3.5 3.5 7.5-8"></path></svg></span><span style="flex: 1; height: 2px; border-radius: 1px; background: rgba(107, 113, 118, 0.55)"></span><span style="flex: none; width: 14px; height: 14px; border-radius: 50%; background: rgba(107, 113, 118, 0.85); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block"><path d="M6.5 12.5l3.5 3.5 7.5-8"></path></svg></span><span style="flex: 1; height: 2px; border-radius: 1px; background: rgba(107, 113, 118, 0.55)"></span><span style="flex: none; width: 14px; height: 14px; border-radius: 50%; background: rgba(107, 113, 118, 0.85); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block"><path d="M6.5 12.5l3.5 3.5 7.5-8"></path></svg></span><span style="flex: 1; height: 2px; border-radius: 1px; background: rgba(107, 113, 118, 0.55)"></span><span style="flex: none; width: 22px; height: 22px; border-radius: 50%; background: #1D6B5B; box-shadow: 0 0 0 2px #FFFFFF; color: #FFFFFF; font-size: 12px; line-height: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums">4</span><span style="flex: 1; height: 2px; border-radius: 1px; background: #E1E3DF"></span><span style="flex: none; width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #858C91; background: #FFFFFF"></span><span style="flex: 1; height: 2px; border-radius: 1px; background: #E1E3DF"></span><span style="flex: none; width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #858C91; background: #FFFFFF"></span><span style="flex: 1; height: 2px; border-radius: 1px; background: #E1E3DF"></span><span style="flex: none; width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #858C91; background: #FFFFFF"></span><span style="flex: 1; height: 2px; border-radius: 1px; background: #E1E3DF"></span><span style="flex: none; width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #858C91; background: #FFFFFF"></span><span style="flex: 1; height: 2px; border-radius: 1px; background: #E1E3DF"></span><span style="flex: none; width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #858C91; background: #FFFFFF"></span><span style="flex: 1; height: 2px; border-radius: 1px; background: #E1E3DF"></span><span style="flex: none; width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #858C91; background: #FFFFFF"></span><span style="flex: 1; height: 2px; border-radius: 1px; background: #E1E3DF"></span><span style="flex: none; width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #858C91; background: #FFFFFF"></span>
        </div>
        <div style="margin-top: auto; display: flex; align-items: center; gap: 4px">
          <span style="display: flex; color: #5A6066"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M4 10.5v3"></path><path d="M8 7.5v9"></path><path d="M12 4.5v15"></path><path d="M16 8.5v7"></path><path d="M20 11v2"></path></svg></span>
          <span style="flex: 1; min-width: 0; margin-left: 4px; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">St Mary&#8217;s Basilica</span>
          <button aria-label="Replay" style="flex: none; width: 48px; height: 48px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <span style="width: 36px; height: 36px; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center"><span style="display: flex; color: #16181A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M5 12a7 7 0 1 0 2.05-4.95"></path><path d="M5 4.5V9h4.5"></path></svg></span></span>
            </button>
          <button aria-label="Pause" style="flex: none; width: 48px; height: 48px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <span style="width: 36px; height: 36px; border-radius: 50%; background: #EEEFEC; display: flex; align-items: center; justify-content: center"><span style="display: flex; color: #16181A"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none; display: block"><rect x="6" y="4.75" width="4.25" height="14.5" rx="1.4"></rect><rect x="13.75" y="4.75" width="4.25" height="14.5" rx="1.4"></rect></svg></span></span>
            </button>
          <button aria-label="Skip" style="flex: none; width: 48px; height: 48px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <span style="width: 36px; height: 36px; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center"><span style="display: flex; color: #16181A"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none; display: block"><path d="M4.75 6.3v11.4a1.1 1.1 0 0 0 1.73.9l8.1-5.7a1.1 1.1 0 0 0 0-1.8l-8.1-5.7a1.1 1.1 0 0 0-1.73.9z"></path><rect x="16.75" y="5.25" width="2.75" height="13.5" rx="1.375"></rect></svg></span></span>
            </button>
        </div>
      </article>
      <p style="margin: 0; font-size: 13px; line-height: 18px; color: #2B3034; text-align: center"><span style="font-weight: 600">2&#215;4</span> &#183; Active tour (default size)</p>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
      <article aria-label="CityTour widget, 2 by 2, no tour running" style="width: 184px; height: 184px; padding: 14px 16px 16px; box-sizing: border-box; border-radius: 20px; background: #FFFFFF; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 6px">
          <span aria-hidden="true" style="flex: none; width: 16px; height: 16px; border-radius: 5px; background: #1D6B5B; display: flex; align-items: center; justify-content: center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display: block"><path d="M7.5 17.5c1-3.5 4.5-3.25 6-5.5s.75-3.5.75-3.5" stroke="#F4F5F3" stroke-width="2" stroke-linecap="round"></path><circle cx="14.6" cy="7.2" r="1.9" fill="#F4F5F3"></circle></svg>
          </span>
          <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #5A6066">CityTour</span>
        </div>
        <span style="margin-top: 12px; font-size: 18px; line-height: 24px; font-weight: 700">The Royal Route</span>
        <span style="margin-top: 2px; font-size: 12px; line-height: 16px; font-weight: 500; color: #5A6066; font-variant-numeric: tabular-nums">11 stops &#183; 2.5 km</span>
        <button style="margin-top: auto; height: 48px; border: 0; border-radius: 24px; background: #1D6B5B; color: #FFFFFF; font-family: inherit; font-size: 16px; line-height: 22px; font-weight: 500; cursor: pointer">Start</button>
      </article>
      <p style="margin: 0; font-size: 13px; line-height: 18px; color: #2B3034; text-align: center"><span style="font-weight: 600">2&#215;2</span> &#183; No tour</p>
    </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    return { };
  }
}
</script>
</body>
</html>
