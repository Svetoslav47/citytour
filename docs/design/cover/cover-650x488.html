<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CityTour cover 650x488</title>
<style>
  html,body{margin:0;width:1300px;height:976px;overflow:hidden;background:#0E1A17}
  body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#fff}
  .bg{position:absolute;inset:0;background:url(../../../data/course/krakow/tour/cover.jpg) center/cover no-repeat}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,20,17,.92) 0%,rgba(8,20,17,.78) 42%,rgba(8,20,17,.15) 75%,rgba(8,20,17,0) 100%)}
  .copy{position:absolute;left:80px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center;gap:28px}
  .brand{display:flex;align-items:center;gap:22px}
  .brand img{width:104px;height:104px;border-radius:24px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  .brand h1{font-size:76px;line-height:1;margin:0;font-weight:700;letter-spacing:-1px}
  .tag{font-size:46px;line-height:1.12;margin:0;font-weight:650;letter-spacing:-.5px}
  .sub{font-size:25px;line-height:1.45;margin:0;color:rgba(255,255,255,.82)}
  .pills{display:flex;gap:12px;flex-wrap:wrap}
  .pill{font-size:20px;font-weight:600;padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28)}
  .phone{position:absolute;right:86px;top:118px;width:400px;height:740px;border-radius:58px;background:#111;padding:14px;box-sizing:border-box;box-shadow:0 24px 70px rgba(0,0,0,.55)}
  .phone img{width:100%;height:100%;object-fit:cover;object-position:center top;border-radius:46px;display:block}
  .credit{position:absolute;left:80px;bottom:26px;font-size:15px;color:rgba(255,255,255,.6)}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="shade"></div>
  <div class="copy">
    <div class="brand"><img src="../icon/composite.png" alt=""><h1>CityTour</h1></div>
    <p class="tag">Eyes on the city,<br>not the screen.</p>
    <p class="sub">An audio guide that walks with you and tells each place's story as you reach it. Any city, in your language.</p>
    <div class="pills"><span class="pill">HarmonyOS</span><span class="pill">EN · PL · 中文</span><span class="pill">Works offline</span></div>
  </div>
  <div class="phone"><img src="../../img/home-walks-cards.jpg" alt="CityTour home screen with walk cards"></div>
  <div class="credit">Photo: Jakub Hałun, CC BY-SA 4.0 (Wikimedia Commons)</div>
</body>
</html>
